# Serves the built dashboard and proxies the API + live socket to the backend.
# In compose the backend is the "api" service; override with -e API_UPSTREAM=... by
# mounting a different conf if the backend lives elsewhere.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the UI itself.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri /index.html;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # REST API. $uri keeps the /api prefix intact for the backend routes.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-API-Key passes straight through to the backend.
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # Live feed: the WebSocket handshake needs the upgrade headers and a long
    # read timeout, or nginx would idle-kill a quiet connection at 60 s.
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # api_key arrives as a query parameter and passes through with the request URI.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
